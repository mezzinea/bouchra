<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collections — BOUCHRA Modest Fashion</title>
  <meta name="description" data-i18n-attr="content:meta.collectionDesc" content="Browse BOUCHRA abayas, Islamic dresses, everyday modest wear and occasion dresses. Order directly on WhatsApp.">
  <link rel="icon" type="image/png" href="img/bouchra_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
  <script src="js/i18n.js?v=6"></script>
</head>
<body data-page="collection">
  <div data-site-header></div>

  <main>
    <section class="page-hero">
      <p class="eyebrow">BOUCHRA</p>
      <h1 data-collection-title>The Collection</h1>
      <p data-i18n="col.intro">Choose your favourite pieces and order directly on WhatsApp. Our team confirms availability, sizing and delivery with you.</p>
    </section>
    <div class="motif-band"></div>

    <div class="container">
      <div class="toolbar">
        <div class="chips" role="group" data-i18n-attr="aria-label:col.filter" aria-label="Filter by collection" data-chips></div>
        <div class="toolbar__right">
          <span class="toolbar__count" data-count aria-live="polite"></span>
          <label class="visually-hidden" for="sort" data-i18n="col.sortLabel">Sort by</label>
          <select class="select" id="sort" data-sort>
            <option value="featured" data-i18n="col.sortFeatured">Featured</option>
            <option value="new" data-i18n="col.sortNew">Newest first</option>
            <option value="price-asc" data-i18n="col.sortAsc">Price: low to high</option>
            <option value="price-desc" data-i18n="col.sortDesc">Price: high to low</option>
          </select>
        </div>
      </div>
      <div class="grid" data-grid></div>
      <p class="empty" data-empty hidden><span data-i18n="col.empty">No pieces match this selection yet.</span> <a href="collection.html" data-i18n="col.seeAll">See the full collection</a>.</p>
      <div style="height:96px"></div>
    </div>
  </main>

  <div data-site-footer></div>

  <script src="data/catalog.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
  <script src="js/collection.js?v=6"></script>
</body>
</html>
